<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sword</title>
<script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
<style>
  html, body { height: 100%; margin: 0; background: #fff; color: #111; }
  body { display: flex; align-items: center; justify-content: center; cursor: pointer; }
  /* the svg has only a viewBox, so it scales to this box (keeping its shape), lines and all */
  svg { display: block; width: 94vw; height: 94vh; }
</style>
</head>
<body>
<div id="sword"></div>
<script type="mpy" config="pyscript.toml">
from pyscript import HTML, display, when
import sword

parts = sword.load()


@when("click", "body")
def draw(event=None):
    display(HTML(sword.random_svg(parts)), target="sword", append=False)


draw()
</script>
</body>
</html>
